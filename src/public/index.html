<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="petals" aria-hidden="true"></div>

    <main class="stage">
      <header class="brand">
        <p class="mark">Candela</p>
        <h1>Only what you brought burns here.</h1>
        <p class="lede">
          A private ofrenda for someone you love. Local Gemma writes from your notes and refuses to invent the rest.
        </p>
      </header>

      <section class="workspace" aria-label="Build an ofrenda">
        <form id="ofrenda-form" class="gather">
          <label>
            <span>Name</span>
            <input id="name" name="name" required maxlength="80" placeholder="Who is this for?" autocomplete="off" />
          </label>
          <div class="row">
            <label>
              <span>Relationship</span>
              <input id="relationship" name="relationship" maxlength="80" placeholder="Abuela, mentor, friend" />
            </label>
            <label>
              <span>Years</span>
              <input id="years" name="years" maxlength="40" placeholder="1942–2019" />
            </label>
          </div>
          <label>
            <span>Favorite foods</span>
            <textarea id="foods" name="foods" rows="2" placeholder="One per line or comma-separated"></textarea>
          </label>
          <label>
            <span>Songs</span>
            <textarea id="songs" name="songs" rows="2" placeholder="Titles or lines they hummed"></textarea>
          </label>
          <label>
            <span>True stories</span>
            <textarea
              id="stories"
              name="stories"
              rows="4"
              placeholder="Short facts only. One memory per line. Candela will not invent more."
            ></textarea>
          </label>
          <div class="actions">
            <button type="submit" id="light">Light the ofrenda</button>
            <button type="button" id="sample" class="ghost">Load sample</button>
          </div>
          <p id="status" class="status" role="status"></p>
        </form>

        <aside class="altar" id="altar" hidden>
          <div class="flame" aria-hidden="true"></div>
          <p class="altar-kicker" id="altar-meta"></p>
          <h2 id="altar-title"></h2>
          <p id="altar-remembrance" class="remembrance"></p>
          <p id="altar-spoken" class="spoken"></p>
          <ul id="altar-offerings" class="offerings"></ul>
          <p id="altar-ground" class="ground"></p>
        </aside>
      </section>

      <section class="history-wrap" aria-label="Earlier ofrendas">
        <h2>Earlier lights</h2>
        <ul id="history" class="history"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
